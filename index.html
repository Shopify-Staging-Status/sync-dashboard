          <span class="sav-main">
            <span class="sav-num">≈ <span data-count="${monthly}" data-key="savMonth">${monthly}</span><small>h</small></span>
            <span class="sav-lab">of human work saved per month by the automation</span>
          </span>
          <span class="sav-meta">≈ ${fmtHours(sv.perRunH)} h per sync · ${plural(sv.auto.length, 'component', 'components')} on automation</span>
          <span class="sav-more">How it's calculated<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="sav-panel" id="savPanel"${open ? '' : ' hidden'}>
          <div>
            <div class="sav-h">Work one manual sync would take</div>
            ${items}
          </div>
          <div class="sav-sum">
            <div class="sav-bar" aria-hidden="true">${bar}</div>
            <div class="sum-row"><span>One manual sync</span><b>${sv.perRunMin} min ≈ ${fmtHours(sv.perRunH)} h</b></div>
            <div class="sum-row"><span>Manual syncs per month <span class="tag est">estimate</span></span><b>× ${sv.runs}</b></div>
            <div class="sum-row total"><span>Saved per month</span><b>≈ ${fmtHours(sv.monthH)} h</b></div>
            <div class="sum-row"><span>Saved per year</span><b>≈ ${fmtHours(sv.yearH)} h</b></div>
            <p class="sav-note">Counted from the sheet: ${plural(sv.auto.length, 'component', 'components')} whose owner is “${esc(AUTOMATION_SAVINGS.automationOwner)}” and that are not stale, ${sv.fileDep.length} of them pointing to files. Every other number is an estimate set in <code>AUTOMATION_SAVINGS</code> at the top of this file.</p>
          </div>
        </div>`;
      countUp(box);
    }

    // ---------------- Map mode ----------------
    function buildMap() {
      const M = MAP;
      const rows = [];
      let y = 0;
      model.cats.forEach((c, gi) => {
        const start = y;
        c.items.forEach(it => { rows.push({ it, y: y + M.PITCH / 2 }); y += M.PITCH; });
        c.span = [start, y];
        if (gi < model.cats.length - 1) y += M.GROUP_GAP;
      });
      const listH = y;
      const H = Math.max(M.MIN_H, listH + 124, M.LEFT_H + 48, model.cats.length * (M.CARD_H + M.CARD_GAP) + 48);
      const listTop = (H - listH) / 2 + 22;   // leaves room for the "test-store" heading above the list
      const listMid = listTop + listH / 2;
      rows.forEach(r => { r.y += listTop; });

      // Category cards sit next to their group of components, without overlapping.
      const pitch = M.CARD_H + M.CARD_GAP, minC = 24 + M.CARD_H / 2, maxC = H - 24 - M.CARD_H / 2;
      let pos = model.cats.map(c => listTop + (c.span[0] + c.span[1]) / 2);
      for (let i = 1; i < pos.length; i++) pos[i] = Math.max(pos[i], pos[i - 1] + pitch);
      if (pos.length && pos[pos.length - 1] > maxC) pos[pos.length - 1] = maxC;
      for (let i = pos.length - 2; i >= 0; i--) pos[i] = Math.min(pos[i], pos[i + 1] - pitch);
      if (pos.length && pos[0] < minC) { const d = minC - pos[0]; pos = pos.map(p => p + d); }

      const leftTop = Math.round((H - M.LEFT_H) / 2);
      const sx = M.LEFT_W / 2 + M.GLOBE / 2 + 4;
      const sy = leftTop + 40 + M.GLOBE / 2;
      const cardR = M.CARD_X + M.CARD_W;
      const f = v => Math.round(v * 10) / 10;
      const sphereLine = cy => { const cx = (sx + M.CARD_X) / 2; return `M${sx} ${f(sy)} C${f(cx)} ${f(sy)} ${f(cx)} ${f(cy)} ${M.CARD_X - 4} ${f(cy)}`; };

      let svg = '';
      pos.forEach((cy, i) => { svg += `<path class="sl" data-cat="${i}" d="${sphereLine(cy)}"/>`; });
      const rowGeo = {};
      rows.forEach(r => {
        const it = r.it;
        const t = Math.max(-1, Math.min(1, (r.y - listMid) / (listH / 2 || 1)));
        const dotX = M.ROW_BASE + M.ROW_ARC * (1 - t * t);
        const cy = pos[it.catIndex];
        const x0 = cardR + 4, x1 = dotX - 7, dx = x1 - x0;
        const curve = `C${f(x0 + dx * 0.28)} ${f(cy)} ${f(x0 + dx * 0.38)} ${f(r.y)} ${f(x1)} ${f(r.y)}`;
        const d = `M${x0} ${f(cy)} ${curve}`;
        const color = STATUS[it.status].color;
        svg += `<path class="ln" data-id="${it.id}" d="${d}" stroke="${color}"${it.automated ? '' : ' stroke-dasharray="2 4"'}/>`;
        rowGeo[it.id] = { x: dotX, y: r.y };
      });
      svg += `<circle class="node" cx="${sx}" cy="${f(sy)}" r="2.5" style="fill:#D9D9D9"/>`;
      pos.forEach((cy, i) => { svg += `<circle class="node" data-cat="${i}" cx="${cardR + 4}" cy="${f(cy)}" r="3"/>`; });

      const cards = model.cats.map((c, i) => `
        <button type="button" class="cat" data-cat="${i}" aria-pressed="false" style="left:${M.CARD_X}px;top:${f(pos[i] - M.CARD_H / 2)}px" aria-label="${esc(c.name)}: ${c.items.length} components, ${pct(c.counts.fresh, c.items.length)}% fresh">
          <span class="cat-main">
            <span class="cat-top"><span class="ico">${catIcon(c.name)}</span><span class="cat-lab" title="${esc(c.name)}">${esc(c.name)}</span></span>
            <span class="cat-bot"><span class="cat-cnt" data-count="${c.items.length}" data-key="cat-${esc(c.name)}">${c.items.length}</span><span class="cat-unit">${c.items.length === 1 ? 'component' : 'components'}</span></span>
          </span>
          ${catRingHTML(c, 0.3 + i * 0.1)}
        </button>`).join('');

      const rowsHTML = rows.map((r, i) => {
        const it = r.it, g = rowGeo[it.id], st = STATUS[it.status];
        const when = it.undated ? 'no date yet, configured manually' : ageText(it) + (it.days === 0 ? '' : ' ago');
        const label = `${it.displayName}, ${st.label}, ${when}, owner ${it.owner || 'unassigned'}`;
        return `<button type="button" class="row" data-id="${it.id}" style="left:${f(g.x - 5)}px;top:${f(g.y - 11)}px;--c:${st.color}" title="${esc(it.component)}" aria-label="${esc(label)}">
          <span class="pt"><i></i></span>
          <span class="nm">${esc(it.displayName)}</span>
          ${badgeHTML(it)}
          ${meterHTML(it, i)}
          <span class="av${it.owner ? '' : ' none'}" aria-hidden="true">${esc(initials(it.owner))}</span>
        </button>`;
      }).join('');

      host.innerHTML = `<div class="fit" id="fit"><div class="stage" id="stage" style="height:${H}px">
        <svg class="lines" width="${M.W}" height="${H}" viewBox="0 0 ${M.W} ${H}" aria-hidden="true">${svg}</svg>
        <canvas class="flow-canvas" id="flowCanvas" aria-hidden="true" style="width:${M.W}px;height:${H}px"></canvas>
        <div class="col-head" style="left:${M.ROW_BASE - 5}px;top:${f(listTop - 50)}px"><span class="lt1">test-store</span><span class="lt2">${plural(model.total, 'component', 'components')} receiving production data</span></div>
        <div class="left" style="top:${leftTop}px">
          <div class="left-title"><div class="lt1">production</div><div class="lt2">source of truth</div></div>
          ${globeHTML(model, M.GLOBE)}
          ${headlineHTML(model)}
          ${legendHTML(model)}
          ${coverageHTML(model)}
          ${tickerHTML()}
        </div>
        ${cards}
        ${rowsHTML}
        <aside class="detail" id="detail" aria-live="polite" style="left:${M.DETAIL_X}px;top:0;width:${M.DETAIL_W}px;height:${H}px"></aside>
      </div></div>`;
      mapGeo = { H, globe: { x: M.LEFT_W / 2, y: sy }, node: { x: sx, y: sy }, cardR, pos };
      scaleMap();
    }

    function scaleMap() {
      const fit = document.getElementById('fit');
      const stage = document.getElementById('stage');
      if (!fit || !stage || !mapGeo) return;
      const s = Math.min(1, host.clientWidth / MAP.W);
      fit.style.width = MAP.W * s + 'px';
      fit.style.height = mapGeo.H * s + 'px';
      stage.style.transform = s < 1 ? `scale(${s})` : '';
    }

    function applyMap() {
      const active = state.hover || state.sel;
      host.querySelectorAll('.row').forEach(el => {
        const it = byId(el.dataset.id);
        el.classList.toggle('dim', !matches(it));
        el.classList.toggle('hi', it.id === active);
        el.classList.toggle('sel', it.id === state.sel);
      });
      const svg = host.querySelector('.lines');
      let hiPath = null;
      host.querySelectorAll('.ln, .fl').forEach(p => {
        const it = byId(p.dataset.id);
        p.classList.toggle('dim', !matches(it));
        if (p.classList.contains('ln')) {
          const on = it.id === active;
          p.classList.toggle('hi', on);
          if (on) hiPath = p;
        }
      });
      if (hiPath && svg) svg.appendChild(hiPath);
      host.querySelectorAll('.sl, .node[data-cat]').forEach(p => p.classList.toggle('on', state.cat !== null && Number(p.dataset.cat) === state.cat));
      host.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-pressed', String(state.cat !== null && Number(b.dataset.cat) === state.cat)));
      const detail = document.getElementById('detail');
      if (detail && detail.dataset.for !== String(state.sel)) {
        detail.dataset.for = String(state.sel);
        detail.innerHTML = detailHTML(byId(state.sel), model, false);
      }
    }

    // ---------------- List mode (narrow screens) ----------------
    function buildList() {
      let i = 0;
      const groups = model.cats.map((c, ci) => `
        <section class="lm-group" data-cat="${ci}">
          <div class="lm-gh"><span class="ico">${catIcon(c.name)}</span><span class="cat-lab">${esc(c.name)}</span><span class="cat-unit">${plural(c.items.length, 'component', 'components')}</span>${catRingHTML(c, 0.3 + ci * 0.1)}</div>
          <div>${c.items.map(it => {
            const st = STATUS[it.status];
            return `<button type="button" class="lrow" data-id="${it.id}" aria-expanded="false" style="--c:${st.color}">
                <span class="pt"><i></i></span>
                <span class="nm">${esc(it.displayName)}</span>
                ${badgeHTML(it)}
                ${meterHTML(it, i++)}
              </button>
              <div class="lm-detail" data-detail="${it.id}" hidden></div>`;
          }).join('')}</div>
        </section>`).join('');
      host.innerHTML = `<div class="lm">
        <div class="lm-hero">
          ${globeHTML(model, 168)}
          <div class="hero-txt">${headlineHTML(model)}${legendHTML(model)}${coverageHTML(model)}${tickerHTML()}</div>
        </div>
        ${groups}
        <p class="empty-msg lm-none" id="lmNone" hidden>No components match this filter.</p>
      </div>`;
      mapGeo = null;
    }

    function applyList() {
      let visible = 0;
      host.querySelectorAll('.lm-group').forEach(g => {
        let n = 0;
        g.querySelectorAll('.lrow').forEach(b => {
          const it = byId(b.dataset.id);
          const ok = matches(it);
          b.hidden = !ok;
          const open = ok && state.open === it.id;
          b.setAttribute('aria-expanded', String(open));
          const d = g.querySelector(`[data-detail="${it.id}"]`);
          d.hidden = !open;
          d.innerHTML = open ? detailHTML(it, model, true) : '';
          if (ok) n++;
        });
        g.hidden = n === 0;
        visible += n;
      });
      document.getElementById('lmNone').hidden = visible > 0;
    }

    // ---------------- Live motion ----------------
    function countUp(root) {
      root.querySelectorAll('[data-count]').forEach(el => {
        const to = Number(el.dataset.count), key = el.dataset.key;
        const from = key in prevCounts ? prevCounts[key] : 0;
        prevCounts[key] = to;
        if (!motion || from === to) { el.textContent = to; return; }
        const t0 = performance.now(), dur = 1200;
        el.textContent = from;
        const step = now => {
          const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(from + (to - from) * e);
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    function drawIn(p, dur, delay) {
      if (p.getAttribute('stroke-dasharray')) {
        p.animate([{ opacity: 0, offset: 0 }], { duration: dur, delay, fill: 'backwards' });
        return;
      }
      const L = p.getTotalLength();
      p.style.strokeDasharray = L;
      const a = p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: dur, delay, easing: 'cubic-bezier(0.3, 0.7, 0.3, 1)', fill: 'backwards' });
      a.onfinish = () => { p.style.strokeDasharray = ''; };
    }

    function introMap() {
      if (!motion) return;
      const stage = document.getElementById('stage');
      stage.querySelectorAll('.sl').forEach((p, i) => drawIn(p, 650, 150 + i * 70));
      stage.querySelectorAll('.ln').forEach((p, i) => drawIn(p, 750, 450 + i * 22));
      stage.querySelectorAll('.cat').forEach((c, i) => c.animate([{ opacity: 0, transform: 'translateX(-10px)', offset: 0 }], { duration: 500, delay: 200 + i * 90, easing: 'ease-out', fill: 'backwards' }));
      stage.querySelectorAll('.row').forEach((r, i) => r.animate([{ opacity: 0, transform: 'translateX(-8px)', offset: 0 }], { duration: 420, delay: 550 + i * 22, easing: 'ease-out', fill: 'backwards' }));
      stage.querySelectorAll('.meter i').forEach((m, i) => m.animate([{ transform: 'scaleX(0)', offset: 0 }], { duration: 700, delay: 700 + i * 22, easing: 'cubic-bezier(0.3, 0.7, 0.3, 1)', fill: 'backwards' }));
    }

    function ping(id) {
      const el = host.querySelector(`[data-id="${id}"] .pt`);
      if (!el) return;
      el.classList.remove('ping');
      void el.offsetWidth;
      el.classList.add('ping');
    }

    // Continuous stream: particles leave the production globe, pass through the
    // sync method card and arrive at every automated test-store component.
    const FLOW = { rate: 0.038, speedMin: 0.15, speedMax: 0.24, trail: 16, startDelay: 1300 };
    let flowState = null;

    function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

    function samplePathEl(el, step, out) {
      const L = el.getTotalLength();
      const n = Math.max(2, Math.ceil(L / step));
      for (let i = 0; i <= n; i++) { const q = el.getPointAtLength(L * i / n); out.push(q.x, q.y); }
    }

    function withLengths(pts) {
      const n = pts.length / 2, cum = new Float32Array(n);
      for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + Math.hypot(pts[2 * i] - pts[2 * i - 2], pts[2 * i + 1] - pts[2 * i - 1]);
      return { pts, cum, len: cum[n - 1] };
    }

    function pointAt(path, d, out) {
      const cum = path.cum, pts = path.pts;
      let lo = 0, hi = cum.length - 1;
      if (d <= 0) { out[0] = pts[0]; out[1] = pts[1]; return out; }
      if (d >= cum[hi]) { out[0] = pts[2 * hi]; out[1] = pts[2 * hi + 1]; return out; }
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
      const t = (d - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
      out[0] = pts[2 * lo] + (pts[2 * hi] - pts[2 * lo]) * t;
      out[1] = pts[2 * lo + 1] + (pts[2 * hi + 1] - pts[2 * lo + 1]) * t;
      return out;
    }

    function buildRoutes() {
      const svg = host.querySelector('.lines');
      const routes = [];
      model.items.forEach(it => {
        if (!it.automated) return;
        const fan = svg.querySelector(`.ln[data-id="${it.id}"]`);
        const sl = svg.querySelector(`.sl[data-cat="${it.catIndex}"]`);
        if (!fan || !sl) return;
        const pts = [];
        samplePathEl(sl, 4, pts);   // production -> sync method card
        samplePathEl(fan, 4, pts);  // card -> component (the jump between them runs hidden under the card)
        const r = withLengths(pts);
        r.id = it.id; r.rgb = hexRgb(STATUS[it.status].color);
        routes.push(r);
      });
      return routes;
    }

    function emitPrefix(fs) {
      // Starts somewhere inside the globe and curves into the outgoing node.
      const g = mapGeo.globe, n = mapGeo.node;
      const phi = (Math.random() * 2 - 1) * 1.45, rad = 10 + Math.random() * 52;
      const sx = g.x + Math.cos(phi) * rad, sy = g.y + Math.sin(phi) * rad;
      const c1x = sx + 28, c1y = sy, c2x = n.x - 34, c2y = n.y;
      const pts = [];
      for (let i = 0; i <= 14; i++) {
        const t = i / 14, u = 1 - t;
        pts.push(u * u * u * sx + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * n.x,
                 u * u * u * sy + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * n.y);
      }
      return withLengths(pts);
    }

    function pickRoute(fs) {
      const active = state.hover;
      let total = 0;
      const w = fs.weights;
      fs.routes.forEach((r, i) => {
        const it = byId(r.id);
        let v = 0;
        if (it && matches(it)) {
          v = it.status === 'fresh' ? 3 : it.status === 'old' ? 1.4 : 0.5;
          if (it.id === active) v += 5;
        }
        w[i] = v; total += v;
      });
      if (!total) return null;
      let x = Math.random() * total;
      for (let i = 0; i < w.length; i++) { x -= w[i]; if (x <= 0) return fs.routes[i]; }
      return fs.routes[fs.routes.length - 1];
    }

    function flowFrame(now) {
      const fs = flowState;
      if (!fs) return;
      fs.raf = requestAnimationFrame(flowFrame);
      const dt = Math.min(50, now - (fs.last || now));
      fs.last = now;
      if (now >= fs.startAt) {
        fs.acc += dt * FLOW.rate;
        while (fs.acc >= 1) {
          fs.acc -= 1;
          const r = pickRoute(fs);
          if (r) {
            const pre = emitPrefix(fs);
            fs.parts.push({ r, pre, d: 0, total: pre.len + r.len, speed: FLOW.speedMin + Math.random() * (FLOW.speedMax - FLOW.speedMin), size: 1.1 + Math.random() * 0.9, alpha: 0.65 + Math.random() * 0.35 });
          }
        }
      }
      const ctx = fs.ctx, H = fs.h, T = fs.tmpA, U = fs.tmpB;
      ctx.clearRect(0, 0, fs.w, H);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (let i = fs.parts.length - 1; i >= 0; i--) {
        const p = fs.parts[i];
        p.d += p.speed * dt;
        if (p.d >= p.total) {
          fs.parts.splice(i, 1);
          if (!fs.pinged[p.r.id] || now - fs.pinged[p.r.id] > 1100) { fs.pinged[p.r.id] = now; ping(p.r.id); }
          continue;
        }
        const at = d => (d <= p.pre.len ? pointAt(p.pre, d, d === p.d ? T : U) : pointAt(p.r, d - p.pre.len, d === p.d ? T : U));
        const head = at(p.d), tail = at(Math.max(0, p.d - FLOW.trail));
        const a = Math.min(1, p.d / 36) * Math.min(1, (p.total - p.d) / 16) * p.alpha;
        const c = p.r.rgb;
        ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${(0.4 * a).toFixed(3)})`;
        ctx.lineWidth = p.size;
        ctx.beginPath(); ctx.moveTo(tail[0], tail[1]); ctx.lineTo(head[0], head[1]); ctx.stroke();
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${(0.13 * a).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(head[0], head[1], p.size * 2.8, 0, 6.2832); ctx.fill();
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${(0.95 * a).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(head[0], head[1], p.size * 0.85, 0, 6.2832); ctx.fill();
      }
    }

    function stopFlow() {
      if (flowState) cancelAnimationFrame(flowState.raf);
      flowState = null;
    }

    function startFlow() {
      stopFlow();
      if (!motion || mode !== 'map' || !mapGeo) return;
      const canvas = document.getElementById('flowCanvas');
      if (!canvas || !canvas.getContext) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(MAP.W * dpr);
      canvas.height = Math.round(mapGeo.H * dpr);
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const routes = buildRoutes();
      if (!routes.length) return;
      flowState = {
        ctx, w: MAP.W, h: mapGeo.H, routes, weights: new Array(routes.length).fill(0),
        parts: [], acc: 0, last: 0, pinged: {}, tmpA: [0, 0], tmpB: [0, 0],
        startAt: performance.now() + FLOW.startDelay, raf: 0,
      };
      flowState.raf = requestAnimationFrame(flowFrame);
    }

    function startTicker() {
      clearInterval(tickerTimer);
      const recent = model.items.filter(it => it.automated).sort((a, b) => a.days - b.days).slice(0, 6);
      const boxes = host.querySelectorAll('.ticker');
      boxes.forEach(b => { b.hidden = !recent.length; });
      if (!recent.length) return;
      const text = it => `<b>${esc(it.displayName)}</b><span>${agoText(it)}</span>`;
      let idx = 0;
      host.querySelectorAll('.tk-line').forEach(el => { el.innerHTML = text(recent[0]); });
      if (!motion || recent.length < 2) return;
      tickerTimer = setInterval(() => {
        if (document.hidden) return;
        idx = (idx + 1) % recent.length;
        host.querySelectorAll('.tk-line').forEach(el => {
          const out = el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px)' }], { duration: 220, easing: 'ease-in', fill: 'forwards' });
          out.onfinish = () => {
            el.innerHTML = text(recent[idx]);
            el.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'ease-out', fill: 'backwards' });
            out.cancel();
            ping(recent[idx].id);
          };
        });
      }, 3400);
    }

    function restartLiveBar() {
      const bar = document.getElementById('liveBar');
      if (!bar) return;
      bar.style.animation = 'none';
      void bar.offsetWidth;
      if (AUTO_REFRESH_MINUTES <= 0) { bar.style.transform = 'scaleX(0)'; return; }
      if (!motion) { bar.style.transform = 'scaleX(1)'; return; }
      bar.style.transform = '';
      bar.style.animation = `liveBar ${AUTO_REFRESH_MINUTES * 60}s linear forwards`;
    }

    function renderMotionBtn() {
      const b = document.getElementById('motionBtn');
      b.setAttribute('aria-pressed', String(motion));
      document.getElementById('motionTxt').textContent = motion ? 'Animations on' : 'Animations off';
      b.setAttribute('aria-label', motion ? 'Animations on' : 'Animations off');
    }

    // ---------------- Render orchestration ----------------
    function apply() {
      if (!model) return;
      filtersEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter)));
      if (mode === 'map') applyMap(); else applyList();
    }

    function layout(force) {
      if (!model) return;
      const next = host.clientWidth >= LIST_MODE_BELOW ? 'map' : 'list';
      if (force || next !== mode) {
        mode = next;
        if (mode === 'map') buildMap(); else buildList();
        apply();
        countUp(host);
        if (mode === 'map') introMap();
        startTicker();
        if (mode === 'map') startFlow(); else stopFlow();
      } else if (mode === 'map') scaleMap();
    }

    function pickDefault() {
      const dated = model.items.filter(it => it.automated);
      if (!dated.length) return model.items.length ? model.items[0].id : null;
      return dated.reduce((a, b) => (b.days > a.days ? b : a)).id;
    }

    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      restartLiveBar();
      if (AUTO_REFRESH_MINUTES > 0) refreshTimer = setTimeout(() => init(true, true), AUTO_REFRESH_MINUTES * 60000);
    }

    async function init(isRefresh, silent) {
      const btn = document.getElementById('refreshBtn');
      const txt = document.getElementById('refreshTxt');
      btn.disabled = true; txt.textContent = isRefresh ? 'Refreshing…' : 'Loading…';
      const { data, fromSheet, error } = await loadSyncData();
      lastLoaded = Date.now();
      btn.disabled = false; txt.textContent = 'Refresh';
      const sig = JSON.stringify(data) + '|' + fromSheet + '|' + error + '|' + new Date().toDateString();
      if (silent && sig === dataSig) { updateAgo(); scheduleRefresh(); return; }
      dataSig = sig;
      const prev = model ? new Map(model.items.map(it => [it.component, it.lastSync])) : null;
      const keepSel = model && state.sel ? (byId(state.sel) || {}).component : null;
      model = buildModel(data, fromSheet);
      model.error = error;
      const again = keepSel && model.items.find(it => it.component === keepSel);
      state.sel = again ? again.id : pickDefault();
      state.hover = null; state.open = null;
      if (state.cat !== null && state.cat >= model.cats.length) state.cat = null;
      renderHeader();
      renderSavings();
      layout(true);
      if (prev) {
        const changed = model.items.filter(it => prev.has(it.component) && prev.get(it.component) !== it.lastSync);
        setTimeout(() => changed.forEach(it => ping(it.id)), 1600);
      }
      scheduleRefresh();
    }

    // ---------------- Events ----------------
    host.addEventListener('click', e => {
      const row = e.target.closest('.row');
      if (row) { state.sel = row.dataset.id; apply(); return; }
      const cat = e.target.closest('.cat');
      if (cat) { const i = Number(cat.dataset.cat); state.cat = state.cat === i ? null : i; apply(); return; }
      const lrow = e.target.closest('.lrow');
      if (lrow) { state.open = state.open === lrow.dataset.id ? null : lrow.dataset.id; apply(); }
    });
    const setHover = id => { if (state.hover !== id) { state.hover = id; if (mode === 'map') applyMap(); } };
    host.addEventListener('mouseover', e => { const row = e.target.closest('.row'); if (row) setHover(row.dataset.id); });
    host.addEventListener('mouseout', e => {
      const row = e.target.closest('.row');
      if (row && !row.contains(e.relatedTarget)) setHover(null);
    });
    host.addEventListener('focusin', e => { const row = e.target.closest('.row'); if (row) setHover(row.dataset.id); });
    host.addEventListener('focusout', e => { if (e.target.closest('.row')) setHover(null); });
    filtersEl.addEventListener('click', e => {
      const b = e.target.closest('button[data-filter]');
      if (b) { state.filter = b.dataset.filter; apply(); }
    });
    qEl.addEventListener('input', () => { state.q = qEl.value; apply(); });
    document.getElementById('savings').addEventListener('click', e => {
      if (!e.target.closest('#savBtn')) return;
      state.savOpen = !state.savOpen;
      document.getElementById('savBtn').setAttribute('aria-expanded', String(state.savOpen));
      document.getElementById('savPanel').hidden = !state.savOpen;
    });
    document.getElementById('refreshBtn').addEventListener('click', () => init(true, false));
    document.getElementById('motionBtn').addEventListener('click', () => {
      motion = !motion;
      try { localStorage.setItem(MOTION_KEY, motion ? 'on' : 'off'); } catch (e) { /* storage unavailable */ }
      document.documentElement.classList.toggle('no-motion', !motion);
      renderMotionBtn();
      if (!motion) { stopFlow(); clearInterval(tickerTimer); }
      layout(true);
      scheduleRefresh();
    });
    renderMotionBtn();
    new ResizeObserver(() => layout(false)).observe(host);
    setInterval(updateAgo, 1000);

    init(false, false);
  </script>
</body>

</html>
